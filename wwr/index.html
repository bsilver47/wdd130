<!DOCTYPE html>
<html lang="en-US">
<!-- This is the Homepage for WWR. The last update to the page was updated 5/12/25 -->

    <head>
        <link rel="stylesheet" href="styles/rafting.css">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="description" content="This is a webpage of Benjamin Silver to contain a demo webpage for a company as a part of WDD 130 from BYU-Pathway">
        <meta name="author" content="Benjamin Sterling Silver">
        <title>Home Page</title>
    </head>
    <body>
        <header>
            <img src="images/rafting-logo.jpeg" width="100" alt="Rafting Logo">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </header>
        <main>
            <div class="hero">
                <img src="images/hero.jpeg" alt="A group having fun while rafting!">
                <h1>White Water Rapids Home Page</h1>
            </div>
            <div class="flexcontainer">
                <form>
                    <h2>Sign up for our mailing list!</h2>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name"><br>
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email"><br>
                    <div>
                        <label>Which would you like updates about:</label><br>
                        <label><input type="checkbox" id="gen" name="sub">General Announcements</label><br>
                        <label><input type="checkbox" id="promo" name="sub">Promotions and Sales</label><br>
                        <label><input type="checkbox" id="new" name="sub">New Destinations</label><br>
                    </div>
                    <button type="submit">Email me please!</button>
                </form>
                <section class="box">
                    <h2>Come, Join the Adventure!</h2>
                    <p> Find out where you are going on you next adventure by going to <a href="trips.html">this webpage!</a></p>
                </section>
            </div>
            <section class="grid">
                <h2>We Are Here to Serve You</h2>
                <figure>
                    <img src="images/water.jpg" alt="Employee Profile">
                    <figcaption>See Enchanting Water!</figcaption>
                </figure>
                <figure>
                    <img src="images/mountains.jpg" alt="Employee Profile">
                    <figcaption>View Mountains!</figcaption>
                </figure>
                <figure>
                    <img src="images/safety.jpg" alt="Employee Profile">
                    <figcaption>Be Safe!</figcaption>
                </figure>
            </section>
        </main>
    
        <footer>

                <a href=https://www.facebook.com/benjamin.silver.585 target="_blank"><img src="images/facebook.png" alt="Facebook"></a>
            </nav>
        </footer>
    </body>
